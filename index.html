<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Case Court Fee & Advocate Fee Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #1a1d23;
    color: #d8dde5;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .container {
    width: 100%;
    max-width: 560px;
    background: #232830;
    border: 1px solid #2e343d;
    border-radius: 10px;
    padding: 36px 36px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 22px;
    border-bottom: 1px solid #2e343d;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #f0f3f8;
    margin-bottom: 6px;
  }
  header p {
    font-size: 12.5px;
    color: #8a93a1;
    letter-spacing: 0.2px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
    color: #b8c0cc;
    letter-spacing: 0.2px;
  }
  .input-row {
    margin-bottom: 18px;
  }
  input[type="text"] {
    width: 100%;
    background: #1a1d23;
    border: 1px solid #353c47;
    border-radius: 6px;
    padding: 12px 14px;
    color: #f0f3f8;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus {
    border-color: #5b7bd0;
    box-shadow: 0 0 0 3px rgba(91,123,208,0.18);
  }
  input[type="text"].error {
    border-color: #c0524a;
    box-shadow: 0 0 0 3px rgba(192,82,74,0.15);
  }
  .btn-row {
    display: flex;
    gap: 10px;
  }
  .btn-calc, .btn-clear {
    color: #f0f3f8;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.4px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
  }
  .btn-calc {
    flex: 1;
    background: #3a5089;
    border: 1px solid #4a609e;
  }
  .btn-calc:hover { background: #45599a; }
  .btn-calc:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(91,123,208,0.3);
  }
  .btn-clear {
    background: #2a2f38;
    border: 1px solid #3a4150;
    color: #b8c0cc;
    display: none;
  }
  .btn-clear.visible { display: inline-block; }
  .btn-clear:hover { background: #353c47; color: #f0f3f8; }
  .btn-clear:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(91,123,208,0.25);
    border-color: #5b7bd0;
  }
  .error-msg {
    color: #d97870;
    font-size: 12.5px;
    margin-top: 8px;
    min-height: 16px;
  }
  .results {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid #2e343d;
    display: none;
  }
  .results.visible { display: block; }
  .result-card {
    background: #1a1d23;
    border: 1px solid #2e343d;
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .result-card:last-child { margin-bottom: 0; }
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .result-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #8a93a1;
    margin-bottom: 4px;
  }
  .result-value {
    font-size: 22px;
    font-weight: 600;
    color: #f0f3f8;
    letter-spacing: 0.3px;
  }
  .result-slab {
    font-size: 12px;
    color: #7d8694;
    margin-bottom: 10px;
    line-height: 1.55;
  }
  .result-slab .hl {
    color: #f0f3f8;
    font-weight: 500;
  }
  .copy-btn {
    background: #2a2f38;
    border: 1px solid #3a4150;
    border-radius: 5px;
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #b8c0cc;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    flex-shrink: 0;
    position: relative;
    font-family: inherit;
  }
  .copy-btn:hover { background: #353c47; color: #f0f3f8; }
  .copy-btn:focus {
    outline: none;
    border-color: #5b7bd0;
    box-shadow: 0 0 0 3px rgba(91,123,208,0.25);
  }
  .copy-btn svg { width: 16px; height: 16px; }
  .copy-feedback {
    position: absolute;
    bottom: calc(100% + 6px);
    right: 0;
    background: #2d8159;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
    letter-spacing: 0.3px;
  }
  .copy-feedback.show { opacity: 1; }
  footer {
    margin-top: 24px;
    font-size: 11.5px;
    color: #6c7482;
    text-align: center;
    letter-spacing: 0.2px;
    line-height: 1.6;
    max-width: 560px;
  }
  .hint {
    font-size: 11.5px;
    color: #6c7482;
    margin-top: 10px;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .hint kbd {
    background: #2a2f38;
    border: 1px solid #3a4150;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10.5px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #b8c0cc;
  }
</style>
</head>
<body>
  <div class="container" role="main">
    <header>
      <h1>Karnataka Court Fee &amp; Advocate Fee Calculator</h1>
      <p>Karnataka Court Fees &amp; Suits Valuation Act, 1958</p>
    </header>

    <div class="input-row">
      <label for="suitValue">Enter Suit Value (₹)</label>
      <input
        type="text"
        id="suitValue"
        inputmode="numeric"
        autocomplete="off"
        spellcheck="false"
        aria-describedby="errorMsg"
        placeholder="e.g. 750000">
      <div class="error-msg" id="errorMsg" role="alert" aria-live="polite"></div>
    </div>

    <div class="btn-row">
      <button type="button" class="btn-calc" id="calcBtn">Calculate</button>
      <button type="button" class="btn-clear" id="clearBtn">Clear</button>
    </div>

    <div class="hint">
      <kbd>Enter</kbd> calculate &nbsp;·&nbsp; <kbd>Esc</kbd> clear &nbsp;·&nbsp; <kbd>Tab</kbd> navigate
    </div>

    <div class="results" id="results" aria-live="polite">
      <div class="result-card">
        <div class="result-label">Court Fee</div>
        <div class="result-slab" id="courtFeeSlab"></div>
        <div class="result-header">
          <div class="result-value" id="courtFeeValue">₹0</div>
          <button type="button" class="copy-btn" id="copyCourt" aria-label="Copy court fee amount">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="copy-feedback" id="copyCourtFeedback">Copied!</span>
          </button>
        </div>
      </div>

      <div class="result-card">
        <div class="result-label">Advocate Fee</div>
        <div class="result-slab" id="advocateFeeSlab"></div>
        <div class="result-header">
          <div class="result-value" id="advocateFeeValue">₹0</div>
          <button type="button" class="copy-btn" id="copyAdvocate" aria-label="Copy advocate fee amount">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="copy-feedback" id="copyAdvocateFeedback">Copied!</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    As per Karnataka Court Fees &amp; Suits Valuation Act, 1958 | Rule 100, Karnataka Civil Rules
  </footer>

<script>
(function () {
  'use strict';

  const courtSlabs = [
    { n: '(i)',    floor: 0,       max: 15000,    base: 0,      rate: 0.025, range: 'Up to ₹15,000' },
    { n: '(ii)',   floor: 15000,   max: 75000,    base: 375,    rate: 0.075, range: '₹15,001 to ₹75,000' },
    { n: '(iii)',  floor: 75000,   max: 250000,   base: 4875,   rate: 0.070, range: '₹75,001 to ₹2,50,000' },
    { n: '(iv)',   floor: 250000,  max: 500000,   base: 17125,  rate: 0.065, range: '₹2,50,001 to ₹5,00,000' },
    { n: '(v)',    floor: 500000,  max: 750000,   base: 33375,  rate: 0.060, range: '₹5,00,001 to ₹7,50,000' },
    { n: '(vi)',   floor: 750000,  max: 1000000,  base: 48375,  rate: 0.055, range: '₹7,50,001 to ₹10,00,000' },
    { n: '(vii)',  floor: 1000000, max: 1500000,  base: 62125,  rate: 0.050, range: '₹10,00,001 to ₹15,00,000' },
    { n: '(viii)', floor: 1500000, max: 2000000,  base: 87125,  rate: 0.045, range: '₹15,00,001 to ₹20,00,000' },
    { n: '(ix)',   floor: 2000000, max: 2500000,  base: 109625, rate: 0.040, range: '₹20,00,001 to ₹25,00,000' },
    { n: '(x)',    floor: 2500000, max: 3000000,  base: 129625, rate: 0.035, range: '₹25,00,001 to ₹30,00,000' },
    { n: '(xi)',   floor: 3000000, max: 4000000,  base: 147125, rate: 0.030, range: '₹30,00,001 to ₹40,00,000' },
    { n: '(xii)',  floor: 4000000, max: 5000000,  base: 177125, rate: 0.025, range: '₹40,00,001 to ₹50,00,000' },
    { n: '(xiii)', floor: 5000000, max: 6000000,  base: 202125, rate: 0.020, range: '₹50,00,001 to ₹60,00,000' },
    { n: '(xiv)',  floor: 6000000, max: Infinity, base: 222125, rate: 0.015, range: 'Above ₹60,00,000' }
  ];

  const advocateSlabs = [
    { n: '(a)', floor: 0,      max: 5000,     base: 0,    rate: 0.100, range: 'Up to ₹5,000' },
    { n: '(b)', floor: 5000,   max: 10000,    base: 500,  rate: 0.075, range: '₹5,001 to ₹10,000' },
    { n: '(c)', floor: 10000,  max: 20000,    base: 875,  rate: 0.055, range: '₹10,001 to ₹20,000' },
    { n: '(d)', floor: 20000,  max: 50000,    base: 1425, rate: 0.040, range: '₹20,001 to ₹50,000' },
    { n: '(e)', floor: 50000,  max: 100000,   base: 2625, rate: 0.030, range: '₹50,001 to ₹1,00,000' },
    { n: '(f)', floor: 100000, max: Infinity, base: 4125, rate: 0.015, range: 'Above ₹1,00,000' }
  ];

  function formatPct(r) {
    return (r * 100).toFixed(1).replace(/\.0$/, '') + '%';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function hl(amount) {
    return '<span class="hl">₹' + Number(amount).toLocaleString('en-IN') + '</span>';
  }

  function describeSlab(slabs, value) {
    const idx = slabs.findIndex(s => value <= s.max);
    if (idx < 0) return '';
    const s = slabs[idx];
    const excess = Math.max(0, value - s.floor);
    const incrementAmt = Math.round(excess * s.rate);
    let parts = escapeHtml(s.n + ' ' + s.range) + ' — ';
    if (s.floor === 0) {
      parts += formatPct(s.rate) + ' of ' + hl(value) + ' = ' + hl(incrementAmt);
    } else {
      parts += 'Base: ' + hl(s.base)
            + ' + ' + formatPct(s.rate)
            + ' on excess of ₹' + excess.toLocaleString('en-IN')
            + ' = ' + hl(incrementAmt);
    }
    return parts;
  }

  function calculateCourtFee(v) {
    if (v <= 0) return { fee: 0, slabIndex: -1 };
    let fee;
    if (v <= 15000)      fee = v * 0.025;
    else if (v <= 75000) fee = 375 + (v - 15000) * 0.075;
    else if (v <= 250000) fee = 4875 + (v - 75000) * 0.070;
    else if (v <= 500000) fee = 17125 + (v - 250000) * 0.065;
    else if (v <= 750000) fee = 33375 + (v - 500000) * 0.060;
    else if (v <= 1000000) fee = 48375 + (v - 750000) * 0.055;
    else if (v <= 1500000) fee = 62125 + (v - 1000000) * 0.050;
    else if (v <= 2000000) fee = 87125 + (v - 1500000) * 0.045;
    else if (v <= 2500000) fee = 109625 + (v - 2000000) * 0.040;
    else if (v <= 3000000) fee = 129625 + (v - 2500000) * 0.035;
    else if (v <= 4000000) fee = 147125 + (v - 3000000) * 0.030;
    else if (v <= 5000000) fee = 177125 + (v - 4000000) * 0.025;
    else if (v <= 6000000) fee = 202125 + (v - 5000000) * 0.020;
    else                   fee = 222125 + (v - 6000000) * 0.015;
    let slabIndex = courtSlabs.findIndex(s => v <= s.max);
    return { fee: Math.round(fee), slabIndex: slabIndex };
  }

  function calculateAdvocateFee(v) {
    if (v <= 0) return { fee: 0, slabIndex: -1 };
    let fee;
    if (v <= 5000)        fee = v * 0.10;
    else if (v <= 10000)  fee = 500 + (v - 5000) * 0.075;
    else if (v <= 20000)  fee = 875 + (v - 10000) * 0.055;
    else if (v <= 50000)  fee = 1425 + (v - 20000) * 0.040;
    else if (v <= 100000) fee = 2625 + (v - 50000) * 0.030;
    else                  fee = 4125 + (v - 100000) * 0.015;
    fee = Math.max(fee, 500);
    let slabIndex = advocateSlabs.findIndex(s => v <= s.max);
    return { fee: Math.round(fee), slabIndex: slabIndex };
  }

  function formatINR(n) {
    return '₹' + Number(n).toLocaleString('en-IN');
  }

  const input = document.getElementById('suitValue');
  const calcBtn = document.getElementById('calcBtn');
  const clearBtn = document.getElementById('clearBtn');
  const errorMsg = document.getElementById('errorMsg');
  const results = document.getElementById('results');
  const courtFeeValue = document.getElementById('courtFeeValue');
  const courtFeeSlab = document.getElementById('courtFeeSlab');
  const advocateFeeValue = document.getElementById('advocateFeeValue');
  const advocateFeeSlab = document.getElementById('advocateFeeSlab');
  const copyCourt = document.getElementById('copyCourt');
  const copyAdvocate = document.getElementById('copyAdvocate');
  const copyCourtFeedback = document.getElementById('copyCourtFeedback');
  const copyAdvocateFeedback = document.getElementById('copyAdvocateFeedback');

  let courtFeeRaw = 0;
  let advocateFeeRaw = 0;

  input.addEventListener('keydown', function (e) {
    const allowed = ['Backspace','Delete','Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Enter','Escape'];
    if (allowed.indexOf(e.key) !== -1) return;
    if (e.ctrlKey || e.metaKey) return;
    if (!/^[0-9]$/.test(e.key)) {
      e.preventDefault();
    }
  });

  function countDigits(str, upto) {
    let n = 0;
    for (let i = 0; i < upto && i < str.length; i++) {
      if (str.charCodeAt(i) >= 48 && str.charCodeAt(i) <= 57) n++;
    }
    return n;
  }

  function caretAfterNthDigit(str, n) {
    if (n <= 0) return 0;
    let count = 0;
    for (let i = 0; i < str.length; i++) {
      if (str.charCodeAt(i) >= 48 && str.charCodeAt(i) <= 57) {
        count++;
        if (count === n) return i + 1;
      }
    }
    return str.length;
  }

  input.addEventListener('input', function () {
    const prev = input.value;
    const selStart = input.selectionStart || 0;
    const digitsBefore = countDigits(prev, selStart);
    const digitsOnly = prev.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
    const formatted = digitsOnly === '' ? '' : Number(digitsOnly).toLocaleString('en-IN');
    if (formatted !== prev) {
      input.value = formatted;
      const newPos = caretAfterNthDigit(formatted, digitsBefore);
      try { input.setSelectionRange(newPos, newPos); } catch (e) {}
    }
    if (errorMsg.textContent) {
      errorMsg.textContent = '';
      input.classList.remove('error');
    }
  });

  function showError(msg) {
    errorMsg.textContent = msg;
    input.classList.add('error');
    results.classList.remove('visible');
  }

  function clearAll() {
    input.value = '';
    errorMsg.textContent = '';
    input.classList.remove('error');
    results.classList.remove('visible');
    clearBtn.classList.remove('visible');
    input.focus();
  }

  function doCalculate() {
    const raw = input.value.replace(/,/g, '').trim();
    if (raw === '') {
      showError('Please enter a suit value.');
      return;
    }
    const val = Number(raw);
    if (!isFinite(val) || isNaN(val) || val < 0) {
      showError('Please enter a valid positive number.');
      return;
    }
    errorMsg.textContent = '';
    input.classList.remove('error');

    const court = calculateCourtFee(val);
    const advocate = calculateAdvocateFee(val);

    courtFeeRaw = court.fee;
    advocateFeeRaw = advocate.fee;

    courtFeeValue.textContent = formatINR(court.fee);
    advocateFeeValue.textContent = formatINR(advocate.fee);

    courtFeeSlab.innerHTML = describeSlab(courtSlabs, val);
    let advText = describeSlab(advocateSlabs, val);
    if (advText && advocate.fee === 500) {
      const computed = (val <= 5000) ? val * 0.10
        : (val <= 10000) ? 500 + (val - 5000) * 0.075
        : (val <= 20000) ? 875 + (val - 10000) * 0.055
        : (val <= 50000) ? 1425 + (val - 20000) * 0.040
        : (val <= 100000) ? 2625 + (val - 50000) * 0.030
        : 4125 + (val - 100000) * 0.015;
      if (Math.round(computed) < 500) {
        advText += ' · Minimum ' + hl(500) + ' applied';
      }
    }
    advocateFeeSlab.innerHTML = advText;

    results.classList.add('visible');
    clearBtn.classList.add('visible');
  }

  calcBtn.addEventListener('click', doCalculate);
  clearBtn.addEventListener('click', clearAll);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      const tag = (e.target && e.target.tagName) || '';
      if (e.target === copyCourt || e.target === copyAdvocate) return;
      if (e.target === calcBtn) { e.preventDefault(); doCalculate(); return; }
      if (e.target === input || tag === 'BODY') {
        e.preventDefault();
        doCalculate();
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      clearAll();
    }
  });

  function copyAmount(amount, feedbackEl) {
    const text = String(amount);
    const showOk = () => {
      feedbackEl.classList.add('show');
      setTimeout(() => feedbackEl.classList.remove('show'), 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showOk, fallback);
    } else {
      fallback();
    }
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      showOk();
    }
  }

  function bindCopy(btn, getAmount, feedbackEl) {
    btn.addEventListener('click', function () {
      copyAmount(getAmount(), feedbackEl);
    });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        copyAmount(getAmount(), feedbackEl);
      }
    });
  }

  bindCopy(copyCourt, () => courtFeeRaw, copyCourtFeedback);
  bindCopy(copyAdvocate, () => advocateFeeRaw, copyAdvocateFeedback);

  input.focus();
})();
</script>
</body>
</html>
